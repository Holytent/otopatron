<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#087d83">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OtoPatron">
<title>OtoPatron — Galeri Simülatör</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101e30;color:#eef4f8;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}
#play{position:absolute;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);max-width:540px;margin:auto;overflow:hidden}
canvas{display:block;width:100%;height:100%;outline:0;touch-action:none}#launch{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px 24px 88px;background:#101e30;z-index:2}
.card{width:100%;max-width:380px;text-align:center}.logo{width:104px;height:104px;border-radius:26px;margin:auto auto 24px;background:#25252e;display:grid;place-items:center}
h1{font-size:30px;letter-spacing:-1px;margin:0 0 8px}h1 span{color:#087d83}.subtitle{font-size:13px;color:#087d83;letter-spacing:2px}p{font-size:14px;line-height:1.6;color:#6c6670}
button{width:100%;min-height:56px;border:0;border-radius:16px;background:#087d83;color:white;font:600 17px system-ui;cursor:pointer;margin:16px 0}button:disabled{opacity:.6}progress{width:100%;height:8px;accent-color:#087d83;border:0;display:none}
.credits{position:absolute;bottom:14px;left:20px;right:20px;text-align:center;font-size:11px;line-height:1.65;color:#77717a}.hint{font-size:12px;border:1px solid #e6dddd;border-radius:14px;padding:14px}.error{color:#ae2536;white-space:pre-line}noscript{position:absolute;inset:0;padding:30px;background:#fff;z-index:5}
@media(max-height:500px){#launch{padding:12px 24px 66px}.logo{width:64px;height:64px;margin-bottom:10px}.logo img{width:64px;height:64px}h1{font-size:24px}#message{margin:8px 0}button{min-height:44px;margin:10px 0}.credits{bottom:8px}}
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="app-icon-v1943.png" />
<link rel="apple-touch-icon" href="app-icon-v1943.png"/>
<link rel="manifest" href="index.manifest.json">

</head>
<body>
<div id="play"><canvas id="canvas" tabindex="0">Tarayıcınız oyun ekranını desteklemiyor.</canvas>
<section id="launch"><div class="card">
<div class="logo"><img src="app-icon-v1943.png" alt="OtoPatron" width="104" height="104" style="display:block;border-radius:26px"></div>
<h1>OTO<span>PATRON</span></h1><div class="subtitle">GALERİ SİMÜLATÖR</div>
<p id="message" role="status" aria-live="polite">Galerin seni bekliyor.</p><progress id="progress" aria-label="Oyun yükleniyor"></progress>
<button id="start">OYUNU AÇ</button>
</div><footer class="credits">Ramazan ÖZKESKİN · Sudenur GÜVEZ<br>V1.9.43</footer>
</section></div>
<noscript>Oyunu açmak için Safari ayarlarından JavaScript’i etkinleştirin.</noscript>








<script>

const dependencies = ["pwa-lifecycle.js", "music-client.js", "startup-guard.js", "update-client.js", "accounts.js", "mobile-editor.js", "push-client.js", "engine-loader.js", "$GODOT_URL"];
function loadScript(src){return new Promise((resolve,reject)=>{
 let attempt=0,settled=false;
 function run(){
  attempt++;
  const script=document.createElement('script');script.src=src;script.async=false;
  const timer=setTimeout(()=>{if(settled)return;settled=true;script.remove();reject(new Error('Bağlantı beklenenden uzun sürdü. Yeniden deneyebilirsin.'));},120000);
  script.onload=()=>{if(settled)return;clearTimeout(timer);settled=true;resolve();};
  script.onerror=()=>{if(settled)return;clearTimeout(timer);script.remove();
   if(attempt<3){message.textContent='Bağlantı yeniden kuruluyor · '+(attempt+1)+'/3';run();}
   else{settled=true;reject(new Error('Açılış dosyası indirilemedi. Yeniden dene.'));}
  };
  document.head.appendChild(script);
 }
 run();
});}
async function loadDependencies(){for(const src of dependencies)await loadScript(src);}
// The push worker never serves HTML or game files; registration cannot block UI.
if('serviceWorker' in navigator&&window.isSecureContext){
 navigator.serviceWorker.register('index.service.worker.js',{scope:'./',updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
}

const config = $GODOT_CONFIG;
config.serviceWorker="";
// A new pack name bypasses a previously cached PWA build without deleting saves.
config.mainPack = 'index-release-v1943.pck';
config.fileSizes[config.mainPack] = config.fileSizes['index.pck'];
let engine;let watchdog;let lastProgress=-1;function armWatchdog(){clearTimeout(watchdog);watchdog=setTimeout(()=>{message.textContent="İndirme durdu. İnternetini kontrol edip yeniden dene.";start.disabled=false;start.textContent="YENİDEN DENE";start.onclick=()=>location.reload();},120000);}
const start = document.getElementById('start');
const message = document.getElementById('message');
const progress = document.getElementById('progress');
const canvas = document.getElementById('canvas');
function resizeCanvas(){const rect=canvas.getBoundingClientRect();let ratio=Math.min(window.devicePixelRatio||1,2);if(matchMedia("(pointer:coarse)").matches)ratio=Math.min(ratio,Math.sqrt(1200000/Math.max(1,rect.width*rect.height)));const width=Math.max(1,Math.round(rect.width*ratio)),height=Math.max(1,Math.round(rect.height*ratio));if(canvas.width!==width)canvas.width=width;if(canvas.height!==height)canvas.height=height;}
resizeCanvas();window.addEventListener('resize',resizeCanvas);window.visualViewport?.addEventListener('resize',resizeCanvas);
function fail(error){console.error(error);message.textContent='Oyun açılamadı. Sayfayı yenileyip tekrar deneyin.\n'+(error?.message||String(error));message.className='error';start.disabled=false;start.textContent='TEKRAR DENE';start.onclick=()=>location.reload();}
start.onclick=async()=>{
 start.disabled=true;start.textContent='YÜKLENİYOR…';progress.style.display='block';message.textContent='Oyun dosyaları hazırlanıyor…';
 try {
 await loadDependencies();
 engine = new Engine(config);
 const missing=Engine.getMissingFeatures({threads:false});
 if(missing.length){fail(new Error('Safari’nizi güncelleyin. Eksik destek: '+missing.join(', ')));return;}
  armWatchdog();
 await engine.startGame({canvas,onProgress:(current,total)=>{if(current>lastProgress){lastProgress=current;armWatchdog();}if(total>0){progress.max=total;progress.value=current;message.textContent='Yükleniyor · %'+Math.min(99,Math.max(0,Math.round(current/total*100)));}else{progress.removeAttribute('value');}}});
  clearTimeout(watchdog);window.otoStartup?.engineReady();canvas.focus();
  if(config.serviceWorker && 'serviceWorker' in navigator && window.isSecureContext)engine.installServiceWorker().catch(console.warn);
 }catch(error){clearTimeout(watchdog);fail(error);}
};
</script>
</body></html>
